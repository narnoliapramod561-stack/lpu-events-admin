name: Database Size Guardrail & Growth Maintenance

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) to detect growth well before 500 MB limit
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual on-demand trigger anytime from GitHub Actions UI

permissions:
  contents: read

jobs:
  database-guardrail:
    name: Execute Supabase Database Size Guardrail
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Database Guardrail Routine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/database_size_guardrail.mjs
