<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260927" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=20260927" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=20260927" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=20260927" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=20260927" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260927" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260927" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <title>LPU Events — Super Admin Portal</title>

    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Google Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Theme Initialization -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('lpu_admin_theme');
          if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Tailwind CSS is built at compile time via @tailwindcss/vite and /src/index.css -->
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        vertical-align: middle;
        user-select: none;
      }
    </style>
  </head>
  <body data-clarity-mask="True">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
