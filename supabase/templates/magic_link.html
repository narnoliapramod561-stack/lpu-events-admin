<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LPU Events Administrative Access Code</title>
</head>
<body style="font-family: sans-serif; background-color: #090a0f; color: #ffffff; padding: 24px;">
  <div style="max-width: 500px; margin: 0 auto; background: #121319; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 32px;">
    <h2 style="color: #ff6b00; margin-top: 0;">LPU Events Administrative Portal</h2>
    <p style="color: #a1a5b7; font-size: 14px; line-height: 1.6;">
      Use the following 6-digit verification code to log in to your administrative console:
    </p>
    <div style="background: rgba(255, 107, 0, 0.1); border: 1px dashed #ff6b00; border-radius: 8px; padding: 16px; text-align: center; margin: 24px 0;">
      <span style="font-size: 28px; font-weight: 700; letter-spacing: 6px; color: #ff6b00;">{{ .Token }}</span>
    </div>
    <p style="color: #7e8299; font-size: 12px; margin-bottom: 0;">
      If you did not request this code, please ignore this email.
    </p>
  </div>
</body>
</html>
